<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FastRouter</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --fg:#111; --mut:#667; --line:#e3e5ea; --ok:#1a7f37; --warn:#b35900; --off:#888; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#171a21; --fg:#e8eaf0; --mut:#99a; --line:#262a33; --ok:#3fb950; --warn:#e3a008; } }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; }
  header h1 { margin:0; font-size:18px; } header span { color:var(--mut); }
  main { padding:20px 24px; display:grid; gap:20px; max-width:1100px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  h2 { margin:0 0 10px; font-size:15px; }
  table { width:100%; border-collapse:collapse; } td,th { text-align:left; padding:6px 8px; border-top:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:500; border-top:none; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid currentColor; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .off { color:var(--off); }
  code { font:12px ui-monospace,Menlo,monospace; } .mut { color:var(--mut); }
  .stats { display:flex; gap:28px; } .stats b { font-size:22px; display:block; }
</style>
</head>
<body>
<header><h1>FastRouter</h1><span id="meta">loading…</span></header>
<main>
  <section><div class="stats" id="stats"></div></section>
  <section><h2>Usage <select id="win"><option>24h</option><option>7d</option><option>30d</option><option>all</option></select>
    <span class="mut" id="usagetotal"></span></h2>
    <table id="usage-accounts"></table><h2 style="margin-top:14px">By model</h2><table id="usage-models"></table>
    <p class="mut">Token counts come from upstream usage fields; cost is an estimate from 9Router's price table.</p></section>
  <section><h2>Sign-ins (Codex, GLM)</h2><table id="logins"></table>
    <p><button onclick="signin('codex')">Add Codex account</button> <button onclick="signin('glm')">Add GLM account</button></p>
    <div id="flow" class="mut"></div></section>
  <section><h2>Providers &amp; accounts</h2><table id="providers"></table></section>
  <section><h2>Combos</h2><table id="combos"></table></section>
  <section><h2>Import warnings</h2><table id="warnings"></table></section>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pill = (txt, cls) => `<span class="pill ${cls}">${esc(txt)}</span>`;
async function load() {
  const r = await fetch("/api/status", {credentials: "same-origin"});
  const d = await r.json();
  document.getElementById("meta").textContent = `v${d.version} · up ${Math.round(d.uptimeSec/60)} min`;
  const accts = d.providers.reduce((n,p)=>n+p.Accounts.length,0);
  const usable = d.providers.reduce((n,p)=>n+p.Usable,0);
  document.getElementById("stats").innerHTML = [
    ["Providers", d.providers.length], ["Accounts", accts], ["Usable in core", usable],
    ["Combos", d.combos.length], ["Models", d.models.length], ["API keys", d.apiKeys], ["Warnings", d.warnings.length]
  ].map(([k,v]) => `<div><b>${v}</b><span class="mut">${k}</span></div>`).join("");
  document.getElementById("providers").innerHTML = "<tr><th>Provider</th><th>Prefix</th><th>Type</th><th>Accounts</th></tr>" +
    d.providers.map(p => `<tr><td>${esc(p.Name)}</td><td><code>${esc(p.Prefix)}/</code></td>
      <td>${esc(p.Kind)} ${p.Plugin ? pill("needs plugin","warn") : ""}</td>
      <td>${p.Accounts.map(a => `${esc(a.Name)} <span class="mut">p${a.Priority}</span> ` +
        (!a.Active ? pill("off","off") : a.Status !== "ok" ? pill(a.Status,"warn") : a.Cooling ? pill("cooling down","warn") : pill("ready","ok"))
      ).join("<br>") || '<span class="mut">none</span>'}</td></tr>`).join("");
  document.getElementById("combos").innerHTML = "<tr><th>Name</th><th>Strategy</th><th>Models</th></tr>" +
    d.combos.map(c => `<tr><td>${esc(c.Name)} ${c.Kind ? pill(c.Kind,"off") : ""}</td><td>${esc(c.Strategy)}</td>
      <td>${c.Models.map(m => `<code>${esc(m)}</code>`).join("<br>") || '<span class="mut">empty</span>'}</td></tr>`).join("");
  document.getElementById("warnings").innerHTML = d.warnings.length ? "<tr><th>Kind</th><th>Message</th></tr>" +
    d.warnings.map(w => `<tr><td>${pill(w.Kind,"warn")}</td><td>${esc(w.Message)}</td></tr>`).join("") : '<tr><td class="mut">No warnings</td></tr>';
}
async function loadLogins() {
  const r = await fetch("/api/logins", {credentials: "same-origin"});
  const d = await r.json();
  document.getElementById("logins").innerHTML = "<tr><th>Account</th><th>Provider</th><th>State</th><th>Token</th><th></th></tr>" +
    (d.accounts.length ? d.accounts.map(a => `<tr><td>${esc(a.Name)}</td><td>${esc(a.Provider)}</td>
      <td>${!a.Active ? pill("off","off") : a.Status === "needs-reauth" || a.Expired ? pill("sign in again","warn") : pill("ready","ok")}</td>
      <td class="mut">${a.ExpiresAt ? "expires " + esc(new Date(a.ExpiresAt).toLocaleString()) : ""} ${a.AutoRefresh ? "· refreshes automatically" : a.Provider === "codex" ? "· not refreshed (shared with 9Router)" : ""}</td>
      <td><button onclick="signin('${esc(a.Provider)}','${esc(a.ID)}')">Sign in again</button></td></tr>`).join("")
    : '<tr><td class="mut" colspan="5">No Codex or GLM accounts</td></tr>');
}
let flowTimer;
async function signin(provider, connectionId) {
  const box = document.getElementById("flow");
  const r = await fetch(`/api/login/${provider}/start`, {method: "POST", credentials: "same-origin",
    headers: {"Content-Type": "application/json", "X-FastRouter-Dashboard": "1"}, body: JSON.stringify({connectionId: connectionId || ""})});
  if (!r.ok) { box.textContent = await r.text(); return; }
  const f = await r.json();
  window.open(f.url, "_blank", "noopener");
  box.innerHTML = `Sign-in opened in a new tab (<a href="${esc(f.url)}" target="_blank" rel="noopener">open again</a>). ${esc(f.message || "")}` +
    (f.kind === "browser" ? `<br>If the tab ends on an error page, paste its address here: <input id="paste" size="50"> <button onclick="paste('${esc(f.id)}')">Finish</button>` : "");
  clearInterval(flowTimer);
  flowTimer = setInterval(async () => {
    const s = await (await fetch(`/api/login/flows/${f.id}`, {credentials: "same-origin"})).json();
    if (s.status !== "pending") { clearInterval(flowTimer); box.textContent = s.status === "done" ? "Signed in." : "Sign-in failed: " + s.message; loadLogins(); load(); }
  }, 2000);
}
async function paste(id) {
  const r = await fetch(`/api/login/flows/${id}/callback`, {method: "POST", credentials: "same-origin",
    headers: {"Content-Type": "application/json", "X-FastRouter-Dashboard": "1"}, body: JSON.stringify({url: document.getElementById("paste").value})});
  if (!r.ok) document.getElementById("flow").textContent = await r.text();
}
const n = v => Number(v||0).toLocaleString();
const usd = v => "$" + Number(v||0).toFixed(v >= 1 ? 2 : 4);
const usageRows = (rows, label) => `<tr><th>${label}</th><th>Requests</th><th>Failed</th><th>Input</th><th>Cached</th><th>Output</th><th>Reasoning</th><th>Cost</th><th>Avg ms</th></tr>` +
  (rows.length ? rows.map(r => `<tr><td>${esc(r.name || r.key || "(none)")} ${r.provider && r.name ? `<span class="mut">${esc(r.provider)}</span>` : ""}</td>
    <td>${n(r.requests)}</td><td>${r.failures ? pill(n(r.failures),"warn") : 0}</td><td>${n(r.input_tokens)}</td><td>${n(r.cache_read_tokens)}</td>
    <td>${n(r.output_tokens)}</td><td>${n(r.reasoning_tokens)}</td><td>${usd(r.cost_usd)}</td><td>${n(r.avg_latency_ms)}</td></tr>`).join("")
    : '<tr><td class="mut" colspan="9">No requests in this window</td></tr>');
async function loadUsage() {
  const r = await fetch("/api/usage?window=" + document.getElementById("win").value, {credentials: "same-origin"});
  const d = await r.json();
  if (!d.accounts) return;
  document.getElementById("usage-accounts").innerHTML = usageRows(d.accounts, "Account");
  document.getElementById("usage-models").innerHTML = usageRows(d.models, "Model");
  const t = d.accounts.reduce((a,r)=>({req:a.req+r.requests, cost:a.cost+r.cost_usd}), {req:0,cost:0});
  document.getElementById("usagetotal").textContent = `${n(t.req)} requests · ${usd(t.cost)}`;
}
document.getElementById("win").onchange = loadUsage;
load(); loadUsage(); loadLogins(); setInterval(() => { load(); loadUsage(); }, 10000);
</script>
</body>
</html>
