name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./... && go vet ./... && go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test npm/test.js
