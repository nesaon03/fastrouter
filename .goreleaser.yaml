# GoReleaser v2 config. Local builds only: nothing is published anywhere.
#   goreleaser check
#   goreleaser release --snapshot --clean   # archives + checksums in dist/, no upload
version: 2

project_name: fastrouter

before:
  hooks:
    - go mod verify

builds:
  - id: fastrouter
    main: ./cmd/fastrouter
    binary: fastrouter
    env:
      - CGO_ENABLED=0
    targets:
      - windows_amd64
      - linux_amd64_v1
      - darwin_arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/zenpo/fastrouter/internal/server.Version={{ .Version }}
      # GoReleaser has no git info when the repo has no remote (ShortCommit is
      # "none"); leave commit/date unset then so the binary falls back to Go's
      # embedded VCS info (vcs.revision / vcs.time).
      - '{{ if ne .ShortCommit "none" }}-X main.commit={{ .ShortCommit }} -X main.date={{ .CommitDate }}{{ end }}'
    mod_timestamp: '{{ if ne .ShortCommit "none" }}{{ .CommitTimestamp }}{{ end }}'

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - PACKAGING.md
      - src: scripts/install.ps1
        dst: install.ps1

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  disable: true

# No publishing: no GitHub/GitLab release, no Docker push, no package repos.
release:
  disable: true
